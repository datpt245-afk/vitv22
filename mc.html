<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn hình Trắc nghiệm - Game 1 (Ngẫu nhiên)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .quiz-card { background: #ffffff; width: 100%; max-width: 680px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 28px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #666; font-size: 14px; font-weight: 600; }
    .question-box { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 24px; line-height: 1.5; min-height: 60px; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
    .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 10px; padding: 14px 18px; font-size: 15px; color: #333; text-align: left; cursor: pointer; transition: all 0.2s ease; font-weight: 500; }
    .option-btn:hover { background: #eef2ff; border-color: #6366f1; }
    .option-btn.correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: 700; }
    .option-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
    .controls { display: flex; justify-content: flex-end; }
    .next-btn { background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .next-btn:hover { background: #4338ca; }
    .next-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="quiz-card">
  <div class="header">
    <span>Game 1: Giai đoạn 30 - 31</span>
    <span id="question-tracker">Câu 1 / 30</span>
  </div>

  <div class="question-box" id="question-text">Đang tải câu hỏi...</div>

  <div class="options-grid" id="options-container"></div>

  <div class="controls">
    <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
  </div>
</div>

<script>

  { id: "1.2", question: "Giai đoạn 1929 - 1933, sự kiện nào đã gây ảnh hưởng đến các nước thuộc địa và phụ thuộc, làm cho mọi hoạt động sản xuất đình đốn?", options: ["Khủng hoảng kinh tế thế giới", "Chiến tranh thế giới thứ nhất kết thúc", "Khủng hoảng tài chính châu Á", "Phong trào Bãi công của giai cấp công nhân quốc tế"], correctAnswer: 0 },
  { id: "2", question: "Điền vào chỗ trống: '.... ra đời với hệ thống tổ chức thống nhất và cương lĩnh chính trị đúng đắn, nắm quyền lãnh đạo duy nhất đối với cách mạng Việt Nam'.", options: ["Đảng Cộng sản Việt Nam", "Hội Việt Nam Cách mạng Thanh niên", "Mặt trận Việt Minh", "Việt Nam Quốc Dân Đảng"], correctAnswer: 0 },
  { id: "2.1", question: "Đảng Cộng sản Việt Nam được thành lập vào thời gian nào và tại đâu?", options: ["Từ ngày 03/02/1930, tại Cửu Long (Hương Cảng, Trung Quốc)", "Từ ngày 03/02/1930, tại Cao Bằng (Việt Nam)", "Từ ngày 01/05/1930, tại Quảng Châu (Trung Quốc)", "Từ ngày 26/03/1931, tại Hà Nội (Việt Nam)"], correctAnswer: 0 },
  { id: "2.3", question: "Ai là người chủ trì Hội nghị hợp nhất các tổ chức cộng sản để thành lập Đảng Cộng sản Việt Nam đầu năm 1930?", options: ["Nguyễn Ái Quốc", "Trần Phú", "Lê Hồng Phong", "Ngô Gia Tự"], correctAnswer: 0 },
  { id: "3", question: "Từ ngày 14 đến ngày 31/10/1930, tại Hương Cảng (Trung Quốc), sự kiện gì đã diễn ra?", options: ["Ban Chấp hành Trung ương họp Hội nghị lần thứ nhất", "Hội nghị hợp nhất các tổ chức cộng sản thành lập Đảng", "Đại hội đại biểu toàn quốc lần thứ nhất của Đảng", "Hội nghị thành lập Mặt trận Dân tộc Thống nhất"], correctAnswer: 0 },
  { id: "3.1", question: "Ai là người chủ trì Hội nghị Ban Chấp hành Trung ương Đảng tháng 10/1930 tại Hương Cảng?", options: ["Trần Phú", "Nguyễn Ái Quốc", "Hà Huy Tập", "Nguyễn Văn Cừ"], correctAnswer: 0 },
  { id: "3.2", question: "Tại Hội nghị Trung ương tháng 10/1930, ai đã được bầu làm Tổng Bí thư đầu tiên của Đảng?", options: ["Trần Phú", "Lê Hồng Phong", "Nguyễn Văn Cừ", "Trường Chinh"], correctAnswer: 0 },

  { id: "4.1", question: "Đảng Cộng sản Việt Nam đổi tên thành Đảng Cộng sản Đông Dương vào thời gian nào?", options: ["Tháng 10/1930", "Tháng 02/1930", "Tháng 03/1935", "Tháng 05/1941"], correctAnswer: 0 },

  { id: "5.1", question: "Luận cương Chính trị tháng 10/1930 do ai khởi thảo?", options: ["Trần Phú", "Nguyễn Ái Quốc", "Lê Hồng Phong", "Ngô Gia Tự"], correctAnswer: 0 },
  { id: "5.2", question: "Luận cương Chính trị của Đảng Cộng sản Đông Dương được thông qua vào thời gian nào?", options: ["Tháng 10/1930", "Tháng 02/1930", "Tháng 03/1935", "Tháng 05/1941"], correctAnswer: 0 },
  { id: "6", question: "Dự thảo Luận cương chính trị tháng 10/1930 được đồng chí Trần Phú viết ở đâu?", options: ["Nhà số 90 phố Thợ Nhuộm, Hà Nội", "Pắc Bó, Cao Bằng", "Tân Trào, Tuyên Quang", "Nhà số 48 phố Hàng Ngang, Hà Nội"], correctAnswer: 0 },
  { id: "6.2", question: "Tại ngôi nhà số 90 phố Thợ Nhuộm (Hà Nội), ai là người đã viết nên Luận cương chính trị tháng 10/1930?", options: ["Trần Phú", "Nguyễn Ái Quốc", "Lê Hồng Phong", "Trường Chinh"], correctAnswer: 0 },
  { id: "6.3", question: "Hiện nay, ngôi nhà số 90 phố Thợ Nhuộm (Hà Nội) đang được xếp hạng là loại di tích gì?", options: ["Di tích lịch sử quốc gia", "Di tích lịch sử cấp Tỉnh/Thành phố", "Di tích kiến trúc nghệ thuật cấp Quốc gia", "Danh lam thắng cảnh cấp Quốc gia"], correctAnswer: 0 },
  { id: "7", question: "Luận cương tháng 10/1930 nhấn mạnh nhiệm vụ gì?", options: ["Phản phong", "Phản đế"], correctAnswer: 0 },
  { id: "7.1", question: "Khẩu hiệu chiến lược của Luận cương tháng 10/1930 trong việc giải quyết vấn đề ruộng đất là gì?", options: ["'Người cày có ruộng'", "'Tăng gia sản xuất, giảm tức giảm phụ'", "'Tấc đất tấc vàng, ruộng đất về tay nông dân'", "'Tịch thu ruộng đất của thực dân chia cho dân nghèo'"], correctAnswer: 0 },
  { id: "7.2", question: "Hạn chế lớn nhất của Luận cương chính trị tháng 10/1930 khi xác định nhiệm vụ cách mạng là gì?", options: ["Chưa đặt nhiệm vụ giải phóng dân tộc lên hàng đầu mà quá nặng về đấu tranh giai cấp và cách mạng ruộng đất", "Không đánh giá đúng khả năng cách mạng của giai cấp công nhân và nông dân", "Coi trọng vai trò của tư sản dân tộc và tiểu tư sản hơn giai cấp vô sản", "Chưa xác định được phương pháp đấu tranh vũ trang để giành chính quyền"], correctAnswer: 0 },
  { id: "8", question: "Luận cương T10/1930, lực lượng cách mạng được tập hợp chủ yếu là ai?", options: ["Công nhân và nông dân", "Công nhân, nông dân và tư sản dân tộc", "Công nhân, nông dân và tiểu tư sản", "Tất cả các tầng lớp, giai cấp yêu nước"], correctAnswer: 0 },
  { id: "9", question: "Đỉnh cao của phong trào cách mạng 1930 - 1931 là gì? Điền vào chỗ trống câu nói của Bác Hồ: '.... bị thất bại, nhưng đã có ảnh hưởng lớn. Tinh thần anh dũng của nó luôn luôn nồng nặc trong tâm hồn quần chúng, và nó đã mở đường cho thắng lợi về sau'.", options: ["Xô viết Nghệ - Tĩnh", "Khởi nghĩa Nam Kỳ", "Khởi nghĩa Bắc Sơn", "Bãi công Bến Thủy"], correctAnswer: 0 },
  { id: "9.1", question: "Chính quyền Xô viết Nghệ - Tĩnh nở rộ và đạt đỉnh cao tại thời điểm nào?", options: ["Tháng 09/1930", "Tháng 02/1930", "Tháng 05/1930", "Tháng 11/1930"], correctAnswer: 0 },
  { id: "9.2", question: "Chính quyền Xô viết Nghệ - Tĩnh là chính quyền của những giai cấp nào?", options: ["Chính quyền công - nông, là chính quyền cách mạng của quần chúng lao động do Đảng lãnh đạo", "Chính quyền tư sản và tiểu tư sản, đại diện cho liên minh trí thức - thương nhân", "Chính quyền liên hiệp gồm công nhân, nông dân, địa chủ và tư sản dân tộc", "Chính quyền quân quản do các lực lượng vũ trang nhân dân nắm giữ toàn bộ thẩm quyền"], correctAnswer: 0 },
  { id: "10", question: "Cuộc biểu tình của nông dân Hưng Nguyên bị đàn áp dữ dội, máy bay Pháp ném bom giết chết 171 người diễn ra vào ngày tháng năm nào?", options: ["Ngày 12/09/1930", "Ngày 01/05/1930", "Ngày 20/10/1930", "Ngày 22/12/1930"], correctAnswer: 0 },
  { id: "10.1", question: "Ngày 12/9 hằng năm hiện nay được chọn làm ngày kỷ niệm gì của tỉnh Nghệ An?", options: ["Ngày Xô viết Nghệ - Tĩnh", "Ngày thành lập Đảng bộ tỉnh Nghệ An", "Ngày hội Văn hóa làng Sen", "Ngày giải phóng tỉnh Nghệ An"], correctAnswer: 0 },
  { id: "10.2", question: "Ngày 12/09/1930, máy bay Pháp ném bom giết chết bao nhiêu người trong cuộc biểu tình của nông dân Hưng Nguyên?", options: ["171 người", "717 người", "117 người", "177 người"], correctAnswer: 0 },
  { id: "11", question: "Ngày 18/11/1930, tổ chức tập hợp lực lượng cách mạng được Đảng chủ trương thành lập là tổ chức gì?", options: ["Hội phản đế đồng minh", "Mặt trận Dân chủ Đông Dương", "Mặt trận Việt Minh", "Hội Liên hiệp Quốc dân Việt Nam"], correctAnswer: 0 },
  { id: "11.1", question: "Ngày 18/11 hằng năm hiện nay được Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam chọn làm ngày truyền thống gì?", options: ["Ngày thành lập Mặt trận Dân tộc Thống nhất Việt Nam", "Ngày thành lập Hội Liên hiệp Phụ nữ Việt Nam", "Ngày truyền thống Công nhân Việt Nam", "Ngày thành lập Đoàn Thanh niên Cộng sản Hồ Chí Minh"], correctAnswer: 0 },
  { id: "11.2", question: "Hội phản đế đồng minh được thành lập vào thời gian nào?", options: ["Ngày 18/11/1930", "Ngày 03/02/1930", "Ngày 26/03/1931", "Ngày 19/05/1941"], correctAnswer: 0 }
];

// Hàm xáo trộn mảng ngẫu nhiên (Fisher-Yates Shuffle)
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// Xáo trộn danh sách câu hỏi ngay từ khi tải trang
shuffleArray(game1Data);

let currentIndex = 0;
let currentCorrectIndex = -1;

function renderQuestion() {
  const qData = game1Data[currentIndex];
  document.getElementById("question-tracker").innerText = `Câu ${currentIndex + 1} / ${game1Data.length}`;
  document.getElementById("question-text").innerText = qData.question;
  document.getElementById("next-btn").disabled = true;

  // Xáo trộn 4 lựa chọn đáp án của câu hỏi hiện tại
  const rawOptions = qData.options.map((opt, i) => ({ text: opt, isCorrect: i === qData.correctAnswer }));
  shuffleArray(rawOptions);

  const container = document.getElementById("options-container");
  container.innerHTML = "";

  rawOptions.forEach((opt, idx) => {
    if (opt.isCorrect) currentCorrectIndex = idx;
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt.text}`;
    btn.onclick = () => selectOption(idx, btn);
    container.appendChild(btn);
  });
}

function selectOption(selectedIndex, selectedBtn) {
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(btn => btn.disabled = true);

  if (selectedIndex === currentCorrectIndex) {
    selectedBtn.classList.add("correct");
  } else {
    selectedBtn.classList.add("wrong");
    buttons[currentCorrectIndex].classList.add("correct");
  }

  document.getElementById("next-btn").disabled = false;
}

function nextQuestion() {
  if (currentIndex < game1Data.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    alert("Bạn đã hoàn thành tất cả các câu hỏi!");
  }
}

// Chạy lần đầu khi mở trang
renderQuestion();
</script>

</body>
</html>
