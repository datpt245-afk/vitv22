<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MC Control</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .score-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .score-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
    }
    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .score-number {
      font-weight: bold;
      color: #ffd43b;
      font-size: 18px;
    }
    .score-input {
      width: 60px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      text-align: center;
      font-size: 14px;
      margin-right: 6px;
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }
    .global-setting-card {
      background: rgba(255, 212, 59, 0.1);
      border: 1px solid #ffd43b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .global-setting-grid {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎤 DUCK RACE — QUẢN TRÒ (MC)</h1>
    
    <div class="card">
      <button class="primary" style="font-size: 20px; padding: 15px 30px;" onclick="start()">▶️ BẮT ĐẦU GAME</button> 
      <button class="danger" style="font-size: 20px; padding: 15px 30px;" onclick="resetGame()">🔄 RESET</button>
      <p id="msg" style="font-weight: bold; color: #ffd43b; margin-top: 10px;"></p>
    </div>

    <!-- CÀI ĐẶT MỨC ĐIỂM CHUNG CHO TOÀN BỘ CÂU HỎI -->
    <div class="global-setting-card">
      <h2 style="margin: 0; color: #ffd43b;">⚙️ MỨC ĐIỂM THƯỞNG CHUNG (ÁP DỤNG CHO TẤT CẢ CÂU HỎI)</h2>
      <div class="global-setting-grid">
        <div>
          <label style="font-weight: bold;">🏆 Điểm thưởng Nhóm mỗi câu: </label>
          <input type="number" id="globalGroupPoints" value="10" style="width: 80px; padding: 6px; font-size: 16px; font-weight: bold; text-align: center;">
        </div>
        <div>
          <label style="font-weight: bold;">👤 Điểm thưởng Cá nhân mỗi câu: </label>
          <input type="number" id="globalIndPoints" value="10" style="width: 80px; padding: 6px; font-size: 16px; font-weight: bold; text-align: center;">
        </div>
      </div>
    </div>

    <!-- DANH SÁCH THÀNH VIÊN ĐÃ VÀO CHUÔNG -->
    <div class="card">
      <h2>👥 THÀNH VIÊN ĐÃ VÀO CHUÔNG (<span id="playerCount">0</span> người)</h2>
      <div id="playerList" style="display: flex; flex-wrap: wrap; gap: 10px;">
        <p style="color: #aaa;">Đang chờ mọi người nhập tên...</p>
      </div>
    </div>

    <!-- KHU VỰC ĐIỂM SỐ -->
    <div class="score-container">
      <div class="score-box">
        <h2 style="color: #48dbfb; margin-top: 0;">🏆 ĐIỂM TẬP THỂ (NHÓM)</h2>
        <div id="teamScores">
          <p style="color: #aaa;">Chưa có dữ liệu điểm nhóm...</p>
        </div>
      </div>

      <div class="score-box">
        <h2 style="color: #2ed573; margin-top: 0;">👤 ĐIỂM CÁ NHÂN</h2>
        <div id="indScores" style="max-height: 380px; overflow-y: auto;">
          <p style="color: #aaa;">Chưa có cá nhân tham gia...</p>
        </div>
      </div>
    </div>

    <!-- SOẠN CÂU HỎI -->
    <div class="card" style="margin-top: 20px;">
      <h2>📝 DANH SÁCH CÂU HỎI</h2>
      <div id="qs"></div>
      <button class="primary" onclick="add()">➕ THÊM CÂU HỎI</button> 
      <button onclick="save()">💾 LƯU CÂU HỎI</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();
    let qs = [];

    function add() {
      qs.push({ q: "", options: ["", "", "", ""], answer: 0 });
      render();
    }

    function render() {
      const qsEl = document.getElementById("qs");
      qsEl.innerHTML = qs.map((q, i) => `
        <div class="card" style="background: rgba(255,255,255,0.05);">
          <h3>Câu ${i + 1}</h3>
          <input class="qq" data-i="${i}" value="${q.q.replaceAll('"', '&quot;')}" placeholder="Nội dung câu hỏi" style="width:100%;padding:12px;margin-bottom:8px;">
          <div class="grid2">
            ${q.options.map((o, j) => `
              <input class="oo" data-i="${i}" data-j="${j}" value="${o.replaceAll('"', '&quot;')}" placeholder="Đáp án ${"ABCD"[j]}" style="padding:12px;">
            `).join("")}
          </div>
          
          <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between;">
            <div>
              Đáp án đúng: 
              <select class="aa" data-i="${i}">
                ${[0,1,2,3].map(j => `<option value="${j}" ${q.answer === j ? "selected" : ""}>${"ABCD"[j]}</option>`).join("")}
              </select>
            </div>
            <button class="danger" onclick="del(${i})">Xóa câu này</button>
          </div>
        </div>
      `).join("");
    }

    function sync() {
      document.querySelectorAll(".qq").forEach(e => qs[e.dataset.i].q = e.value);
      document.querySelectorAll(".oo").forEach(e => qs[e.dataset.i].options[e.dataset.j] = e.value);
      document.querySelectorAll(".aa").forEach(e => qs[e.dataset.i].answer = +e.value);
    }

    function save() {
      sync();
      const gPts = Number(document.getElementById("globalGroupPoints").value) || 10;
      const iPts = Number(document.getElementById("globalIndPoints").value) || 10;
      
      // Gửi cả danh sách câu hỏi lẫn mức điểm chung lên server
      s.emit("mcSaveQuestions", {
        questions: qs,
        globalGroupPoints: gPts,
        globalIndPoints: iPts
      });
    }

    function start() {
      save();
      setTimeout(() => s.emit("mcStart"), 200);
    }

    function del(i) {
      qs.splice(i, 1);
      render();
    }

    function resetGame() {
      if (confirm("Reset game và xóa toàn bộ dữ liệu?")) s.emit("mcReset");
    }

    function adjustTeamScore(teamId) {
      const inputEl = document.getElementById(`team-pts-${teamId}`);
      const val = Number(inputEl.value) || 0;
      if (val === 0) return;
      s.emit("mcAdjustTeamScore", { teamId: teamId, points: val });
      inputEl.value = "";
    }

    function adjustIndScore(key) {
      const safeKey = key.replace(/[^a-zA-Z0-9]/g, "");
      const inputEl = document.getElementById(`ind-pts-${safeKey}`);
      const val = Number(inputEl.value) || 0;
      if (val === 0) return;
      s.emit("mcAdjustIndScore", { playerKey: key, points: val });
      inputEl.value = "";
    }

    s.on("mcQuestionsSaved", d => msg.textContent = "✅ Đã lưu " + d.count + " câu hỏi (Điểm nhóm: " + d.groupPts + ", Điểm cá nhân: " + d.indPts + ")");
    s.on("mcError", e => msg.textContent = "⚠️ " + e);

    s.on("state", x => {
      if (x.teams) {
        document.getElementById("teamScores").innerHTML = x.teams.map(t => `
          <div class="score-item">
            <div><b>${t.name}</b>: <span class="score-number">${t.score}</span> đ</div>
            <div>
              <input type="number" id="team-pts-${t.id}" class="score-input" placeholder="±Đ">
              <button class="primary btn-sm" onclick="adjustTeamScore(${t.id})">Sửa</button>
            </div>
          </div>
        `).join("");
      }

      if (x.playerList) {
        document.getElementById("playerCount").textContent = x.playerList.length;
        if (x.playerList.length === 0) {
          document.getElementById("playerList").innerHTML = `<p style="color: #aaa;">Chưa có ai vào chuông...</p>`;
        } else {
          document.getElementById("playerList").innerHTML = x.playerList.map(p => `
            <div style="background: #ffffff20; padding: 8px 14px; border-radius: 20px; font-weight: bold;">
              👤 ${p.name} <span style="color: #20c779;">(Nhóm ${p.group})</span>
            </div>
          `).join("");
        }

        let indMap = new Map();
        if (x.individuals) {
          x.individuals.forEach(i => indMap.set(i.group + ":" + i.name, i.score));
        }

        if (x.playerList.length > 0) {
          let indHTML = "";
          x.playerList.forEach(p => {
            let key = p.group + ":" + p.name;
            let safeKey = key.replace(/[^a-zA-Z0-9]/g, "");
            let score = indMap.get(key) || 0;

            indHTML += `
              <div class="score-item">
                <div><b>${p.name}</b> <small style="color:#aaa;">(N${p.group})</small>: <span class="score-number">${score}</span> đ</div>
                <div>
                  <input type="number" id="ind-pts-${safeKey}" class="score-input" placeholder="±Đ">
                  <button class="primary btn-sm" onclick="adjustIndScore('${key}')">Sửa</button>
                </div>
              </div>
            `;
          });
          document.getElementById("indScores").innerHTML = indHTML;
        }
      }
    });

    add();
  </script>
</body>
</html>
