<script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let state = null;
    let isAutoSynced = false;
    const qs = id => document.getElementById(id);

    // =========================================================================
    // 📝 1. NHẬP DANH SÁCH CÂU HỎI MỚI CỦA BẠN VÀO ĐÂY
    // (Đáp án đúng: 0 tương ứng A, 1 tương ứng B, 2 tương ứng C, 3 tương ứng D)
    // =========================================================================
    const NEW_QUESTIONS_TO_ADD = [
      {
        q: "Thủ đô của Việt Nam là gì?",
        options: ["Hà Nội", "TP. Hồ Chí Minh", "Đà Nẵng", "Hải Phòng"],
        answer: 0
      },
      {
        q: "1 + 1 bằng mấy?",
        options: ["1", "2", "3", "4"],
        answer: 1
      }
      // ➕ Bạn thêm các câu hỏi tiếp theo ở đây...
    ];

    // =========================================================================
    // 🔀 2. THUẬT TOÁN TRỘN NGẪU NHIÊN CÂU HỎI (Fisher-Yates Shuffle)
    // =========================================================================
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Hàm thực hiện trộn ngân hàng câu hỏi hiện tại
    function shuffleQuestions() {
      if (!state || !state.questions || state.questions.length === 0) {
        return alert("Chưa có câu hỏi nào để trộn!");
      }
      if (confirm("Bạn có muốn trộn ngẫu nhiên thứ tự toàn bộ câu hỏi không?")) {
        const shuffled = shuffleArray(state.questions);
        localStorage.setItem("duck_race_questions", JSON.stringify(shuffled));
        socket.emit("saveQuestions", shuffled);
        alert("🔀 Đã trộn ngẫu nhiên danh sách câu hỏi!");
      }
    }

    // Nạp tự động danh sách câu hỏi mới từ biến NEW_QUESTIONS_TO_ADD (nếu có)
    function appendNewBatchQuestions() {
      if (!NEW_QUESTIONS_TO_ADD || NEW_QUESTIONS_TO_ADD.length === 0) return;
      
      const currentList = state?.questions || [];
      // Kết hợp câu hỏi cũ + câu hỏi mới và trộn ngẫu nhiên luôn
      const combined = currentList.concat(NEW_QUESTIONS_TO_ADD);
      const shuffledCombined = shuffleArray(combined);

      localStorage.setItem("duck_race_questions", JSON.stringify(shuffledCombined));
      socket.emit("saveQuestions", shuffledCombined);
      
      // Xóa bộ đệm sau khi nạp thành công
      NEW_QUESTIONS_TO_ADD.length = 0;
      alert("✅ Đã thêm câu hỏi mới và tự động đảo ngẫu nhiên thứ tự!");
    }

    // =========================================================================
    // 🖥️ 3. RENDER VÀ XỬ LÝ HỆ THỐNG
    // =========================================================================
    function render(x) {
      state = x;

      // Đồng bộ câu hỏi từ LocalStorage nếu Server bị trống
      if (!isAutoSynced && (!x.questions || x.questions.length === 0)) {
        const savedLocally = localStorage.getItem("duck_race_questions");
        if (savedLocally) {
          try {
            const parsed = JSON.parse(savedLocally);
            if (Array.isArray(parsed) && parsed.length > 0) {
              isAutoSynced = true;
              socket.emit("saveQuestions", parsed);
            }
          } catch(e) {}
        }
      }

      // Tự động nạp batch câu hỏi mới nếu được khai báo trong code
      if (NEW_QUESTIONS_TO_ADD.length > 0) {
        appendNewBatchQuestions();
      }

      // Lưu trữ bản sao mới nhất vào LocalStorage
      if (x.questions && x.questions.length > 0) {
        localStorage.setItem("duck_race_questions", JSON.stringify(x.questions));
      }

      // Render Bảng điểm nhóm
      qs("teams").innerHTML = Object.values(x.teams).map(t => 
        `<tr><td><b>${t.name}</b></td><td>${t.correct}</td><td><b style="color:#38bdf8">${t.score}</b></td></tr>`
      ).join("");

      // Render Bảng điểm cá nhân
      let people = [];
      Object.entries(x.teams).forEach(([g, t]) => {
        Object.entries(t.members).forEach(([name, v]) => {
          people.push({ name, g, ...v });
        });
      });
      people.sort((a, b) => b.score - a.score || b.correct - a.correct);
      
      qs("people").innerHTML = people.length ? people.map((p, i) => 
        `<tr><td>${i + 1}</td><td>${p.name}</td><td>Nhóm ${p.g}</td><td>${p.correct}</td><td><b>${p.score}</b></td></tr>`
      ).join("") : `<tr><td colspan="5" class="muted" style="text-align:center">Chưa có người chơi tham gia</td></tr>`;

      // Render Ngân hàng câu hỏi (kèm nút Trộn Ngẫu Nhiên)
      qs("bank").innerHTML = (x.questions.length ? `
        <div style="margin-bottom: 12px;">
          <button class="btn purple" onclick="shuffleQuestions()">🔀 Trộn Ngẫu Nhiên Thứ Tự Câu Hỏi</button>
        </div>
      ` : "") + (x.questions.length ? x.questions.map((q, i) => `
        <div class="q-list-item">
          <div>
            <div><b>Câu ${i + 1}:</b> ${q.q}</div>
            <span class="badge badge-ans">Đáp án đúng: ${["A", "B", "C", "D"][q.answer]}</span>
          </div>
          <button class="btn bad" style="padding: 4px 8px; font-size: 12px;" onclick="deleteQ(${i})">Xóa</button>
        </div>
      `).join("") : "<p class='muted'>Chưa có câu hỏi nào trong ngân hàng.</p>");

      // Render Đường đua vịt
      const icons = ["🟥", "🟦", "🟩", "🟨", "🟪"];
      const colors = ["red", "blue", "green", "yellow", "purple"];
      qs("race").innerHTML = Object.values(x.teams).map((t, i) => {
        const pct = Math.min(100, Math.max(0, (Number(t.score) || 0) * 10));
        return `
          <div class="lane">
            <div class="n">${icons[i]} ${t.name} — ${t.score} đ</div>
            <div class="line"></div>
            <div class="swimDuck ${colors[i]}" style="left: calc(${pct}% - 30px)">
              <span class="body">🦆</span>
              <span class="wave">〰️〰️</span>
            </div>
            <div class="finish">🏁</div>
          </div>
        `;
      }).join("");

      // Render Link kết nối 5 nhóm
      qs("links").innerHTML = [1, 2, 3, 4, 5].map(i => 
        `<p style="margin: 6px 0; font-size: 13px;">🔔 <b>Nhóm ${i}:</b> <code>${location.origin}/?group=${i}</code></p>`
      ).join("");

      // Cập nhật thông tin câu hỏi hiện tại
      if (x.currentQuestion >= 0 && x.questions[x.currentQuestion]) {
        showQuestion(x.questions[x.currentQuestion], x.answerRevealed);
      } else {
        qs("qbox").textContent = "Chưa mở câu hỏi";
        qs("opts").innerHTML = "";
      }
      updateNextButton();
    }

    function showQuestion(q, reveal = false) {
      qs("qbox").textContent = `Câu ${state.currentQuestion + 1}: ${q.q}`;
      const labels = ["A", "B", "C", "D"];
      qs("opts").innerHTML = q.options.map((o, i) => `
        <div class="opt ${reveal && i === q.answer ? 'correct' : ''}">
          ${labels[i]}. ${o} ${reveal && i === q.answer ? ' ✓' : ''}
        </div>
      `).join("");
    }

    function updateNextButton() {
      if (!state) return;
      const nextIdx = state.currentQuestion + 1;
      const btn = qs("nextBtn");
      
      if (!state.questions.length) {
        btn.textContent = "▶️ MỞ CÂU ĐẦU TIÊN";
        btn.disabled = true;
      } else if (nextIdx >= state.questions.length) {
        btn.textContent = "🏁 ĐÃ HẾT CÂU HỎI";
        btn.disabled = true;
      } else {
        btn.textContent = state.currentQuestion < 0 ? "▶️ MỞ CÂU ĐẦU TIÊN" : `▶️ MỞ CÂU TIẾP THEO (${nextIdx + 1})`;
        btn.disabled = false;
      }
    }

    function nextQuestion() {
      if (!state || !state.questions.length) return alert("Vui lòng nhập câu hỏi trước.");
      socket.emit("nextQuestion");
    }

    function addQuestion() {
      const q = qs("newQ").value.trim();
      const opts = [0, 1, 2, 3].map(i => qs("a" + i).value.trim());
      const ans = Number(qs("correctAns").value);

      if (!q || opts.some(x => !x)) return alert("Vui lòng nhập đầy đủ câu hỏi và 4 đáp án.");

      const updatedList = (state?.questions || []).concat([{ q, options: opts, answer: ans }]);
      
      localStorage.setItem("duck_race_questions", JSON.stringify(updatedList));
      socket.emit("saveQuestions", updatedList);

      ["newQ", "a0", "a1", "a2", "a3"].forEach(id => qs(id).value = "");
    }

    function deleteQ(i) {
      if (!confirm("Bạn có chắc chắn muốn xóa câu hỏi này?")) return;
      const updatedList = state.questions.slice();
      updatedList.splice(i, 1);
      
      localStorage.setItem("duck_race_questions", JSON.stringify(updatedList));
      socket.emit("saveQuestions", updatedList);
    }

    function exportQuestions() {
      if (!state || !state.questions.length) return alert("Chưa có câu hỏi nào để xuất file.");
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.questions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `cau_hoi_duck_race_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importQuestions(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            const shuffled = shuffleArray(imported);
            localStorage.setItem("duck_race_questions", JSON.stringify(shuffled));
            socket.emit("saveQuestions", shuffled);
            alert("Nạp và trộn bộ câu hỏi thành công!");
          } else {
            alert("File không đúng định dạng danh sách câu hỏi.");
          }
        } catch(err) {
          alert("Lỗi đọc file JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function resetBuzz() { socket.emit("resetBuzz"); }
    function resetGame() {
      if (confirm("Hành động này sẽ xoá toàn bộ điểm số và thành viên. Bạn có chắc chắn?")) {
        socket.emit("resetGame");
      }
    }
    function saveScore() {
      socket.emit("setScoring", {
        teamStep: Number(qs("teamStep").value),
        personalPoint: Number(qs("personalPoint").value)
      });
      alert("Đã cập nhật cấu hình tính điểm!");
    }

    // Lắng nghe các sự kiện từ Server
    socket.on("state", render);
    
    socket.on("questionOpened", x => {
      qs("winner").textContent = `❓ CÂU HỎI SỐ ${x.index + 1} ĐÃ MỞ!`;
      qs("status").textContent = "Chuông đã bật. Đang chờ người chơi giành quyền trả lời...";
    });

    socket.on("buzzed", x => {
      qs("winner").textContent = `🚨 ${x.name.toUpperCase()} (NHÓM ${x.group}) GIÀNH QUYỀN!`;
      qs("status").textContent = "Thành viên có 10 giây để chọn đáp án trên màn hình điện thoại...";
    });

    socket.on("result", x => {
      qs("winner").textContent = `✅ ${x.name} (NHÓM ${x.group}) TRẢ LỜI ĐÚNG!`;
      qs("status").textContent = `Cộng +${x.teamStep} điểm nhóm và +${x.personalPoint} điểm cá nhân. Chuẩn bị chuyển câu...`;
    });

    socket.on("wrong", x => {
      qs("winner").textContent = x.timedOut 
        ? `⏱️ ${x.name} (NHÓM ${x.group}) HẾT 10 GIÂY!` 
        : `❌ ${x.name} (NHÓM ${x.group}) TRẢ LỜI SAI!`;
      qs("status").textContent = `Nhóm ${x.group} đã bị khóa lượt ở câu này. Chuông đã mở cho các nhóm còn lại cướp quyền!`;
    });

    socket.on("questionSkipped", () => {
      qs("winner").textContent = "⚠️ CẢ 5 NHÓM ĐỀU TRẢ LỜI SAI!";
      qs("status").textContent = "Hệ thống tự động bỏ qua và chuẩn bị chuyển sang câu hỏi tiếp theo...";
    });

    socket.on("resetBuzz", () => {
      qs("winner").textContent = "🔔 CHUÔNG ĐÃ ĐƯỢC MỞ LẠI!";
      qs("status").textContent = "Các nhóm chưa bị khóa lượt có thể tiếp tục bấm chuông.";
    });
  </script>
