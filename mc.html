<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Màn Hình Điều Hành MC</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }
    .box {
      width: min(94vw, 680px);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-send { background: #10b981; }
    .btn-next { background: #3b82f6; }
    .btn-prev { background: #6b7280; }
    .q-display {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
    }
    .opt-item {
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
    }
    .opt-correct {
      color: #10b981;
      font-weight: bold;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
    }
    .q-selector {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #0d1117;
      color: #fff;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="color: #f59e0b; margin-top: 0; text-align: center;">🎙️ MÀN HÌNH ĐIỀU HÀNH MC</h2>
    
    <!-- Chọn câu hỏi nhanh -->
    <label style="font-size: 14px; color: #8b949e;">Chọn nhanh câu hỏi:</label>
    <select id="qSelect" class="q-selector" onchange="jumpToQuestion(this.value)"></select>

    <!-- Khung hiển thị chi tiết câu hỏi hiện tại cho MC -->
    <div class="q-display">
      <h3 id="currentQTitle" style="color: #38bdf8; margin-top: 0;">Câu 1</h3>
      <p id="currentQText" style="font-size: 18px; line-height: 1.4; font-weight: 600;"></p>
      <div id="currentQOptions"></div>
    </div>

    <!-- Nút điều khiển -->
    <button id="sendQBtn" class="btn btn-send">🚀 GỬI CÂU HỎI NÀY NAY</button>
    <div style="display: flex; gap: 10px;">
      <button id="prevQBtn" class="btn btn-prev" style="flex: 1;">⏮️ Câu Trước</button>
      <button id="nextQBtn" class="btn btn-next" style="flex: 1;">⏭️ Câu Tiếp Theo</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();

    // DỮ LIỆU CÂU HỎI ĐÃ ĐƯỢC CHUẨN HÓA VÀ TRỘN LẪN VỊ TRÍ ĐÁP ÁN ĐÚNG
    const rawQuestions = [
      {
        q: "Sự kiện diễn ra từ 1929 – 1933 bắt đầu ở các nước TBCN, ảnh hưởng lớn đến các nước thuộc địa và phụ thuộc, làm cho mọi hoạt động sản xuất đình đốn là gì?",
        options: ["Khủng hoảng kinh tế thế giới (1929 – 1933)", "Chiến tranh thế giới thứ hai bùng nổ (1939 – 1945)", "Khủng hoảng năng lượng thế giới (1973)", "Phong trào Cách mạng thế giới suy thoái (1918 – 1923)"],
        correct: 0
      },
      {
        q: "Cuộc khủng hoảng kinh tế thế giới 1929 – 1933 bắt đầu bùng nổ đầu tiên ở quốc gia nào?",
        options: ["Anh", "Nước Mỹ (bắt đầu từ sự sụp đổ của thị trường chứng khoán Phố Wall vào tháng 10/1929)", "Pháp", "Đức"],
        correct: 1
      },
      {
        q: "Giai đoạn 1929 - 1933, sự kiện nào đã gây ảnh hưởng đến các nước thuộc địa và phụ thuộc, làm cho mọi hoạt động sản xuất đình đốn?",
        options: ["Chiến tranh thế giới thứ nhất kết thúc", "Khủng hoảng tài chính châu Á", "Khủng hoảng kinh tế thế giới", "Phong trào Bãi công của giai cấp công nhân quốc tế"],
        correct: 2
      },
      {
        q: "Điền vào chỗ trống: '.... ra đời với hệ thống tổ chức thống nhất và cương lĩnh chính trị đúng đắn, nắm quyền lãnh đạo duy nhất đối với cách mạng Việt Nam'.",
        options: ["Hội Việt Nam Cách mạng Thanh niên", "Mặt trận Việt Minh", "Việt Nam Quốc Dân Đảng", "Đảng Cộng sản Việt Nam"],
        correct: 3
      },
      {
        q: "Đảng Cộng sản Việt Nam được thành lập vào thời gian nào và tại đâu?",
        options: ["Từ ngày 03/02/1930, tại Cửu Long (Hương Cảng, Trung Quốc)", "Từ ngày 03/02/1930, tại Cao Bằng (Việt Nam)", "Từ ngày 01/05/1930, tại Quảng Châu (Trung Quốc)", "Từ ngày 26/03/1931, tại Hà Nội (Việt Nam)"],
        correct: 0
      },
      {
        q: "Ai là người chủ trì Hội nghị hợp nhất các tổ chức cộng sản để thành lập Đảng Cộng sản Việt Nam đầu năm 1930?",
        options: ["Trần Phú", "Nguyễn Ái Quốc (với tư cách là phái viên của Quốc tế Cộng sản)", "Lê Hồng Phong", "Ngô Gia Tự"],
        correct: 1
      },
      {
        q: "Từ ngày 14 đến ngày 31/10/1930, tại Hương Cảng (Trung Quốc), sự kiện gì đã diễn ra?",
        options: ["Hội nghị hợp nhất các tổ chức cộng sản thành lập Đảng", "Ban Chấp hành Trung ương họp Hội nghị lần thứ nhất", "Đại hội đại biểu toàn quốc lần thứ nhất của Đảng", "Hội nghị thành lập Mặt trận Dân tộc Thống nhất"],
        correct: 1
      },
      {
        q: "Ai là người chủ trì Hội nghị Ban Chấp hành Trung ương Đảng tháng 10/1930 tại Hương Cảng?",
        options: ["Nguyễn Ái Quốc", "Hà Huy Tập", "Trần Phú", "Nguyễn Văn Cừ"],
        correct: 2
      },
      {
        q: "Tại Hội nghị Trung ương tháng 10/1930, ai đã được bầu làm Tổng Bí thư đầu tiên của Đảng?",
        options: ["Lê Hồng Phong", "Nguyễn Văn Cừ", "Trường Chinh", "Trần Phú"],
        correct: 3
      },
      {
        q: "Hội nghị Trung ương tháng 10/1930, Đảng Cộng sản Việt Nam đổi tên thành gì?",
        options: ["Đảng Cộng sản Đông Dương", "Đông Dương Cộng sản Đảng", "An Nam Cộng sản Đảng", "Đảng Lao động Việt Nam"],
        correct: 0
      },
      {
        q: "Đảng Cộng sản Việt Nam đổi tên thành Đảng Cộng sản Đông Dương vào thời gian nào?",
        options: ["Tháng 02/1930", "Tháng 10/1930", "Tháng 03/1935", "Tháng 05/1941"],
        correct: 1
      },
      {
        q: "Hội nghị Trung ương tháng 10/1930 đã thông qua văn kiện quan trọng gì?",
        options: ["Chánh cương tắt, Sách lược tắt của Đảng", "Luận cương Chính trị của Đảng Cộng sản Đông Dương (Luận cương tháng 10/1930)", "Tuyên ngôn độc lập của nước Việt Nam Dân chủ Cộng hòa", "Đề cương về văn hóa Việt Nam"],
        correct: 1
      },
      {
        q: "Luận cương Chính trị tháng 10/1930 do ai khởi thảo?",
        options: ["Nguyễn Ái Quốc", "Lê Hồng Phong", "Ngô Gia Tự", "Trần Phú"],
        correct: 3
      },
      {
        q: "Luận cương Chính trị của Đảng Cộng sản Đông Dương được thông qua vào thời gian nào?",
        options: ["Tháng 10/1930", "Tháng 02/1930", "Tháng 03/1935", "Tháng 05/1941"],
        correct: 0
      },
      {
        q: "Dự thảo Luận cương chính trị tháng 10/1930 được đồng chí Trần Phú viết ở đâu?",
        options: ["Pắc Bó, Cao Bằng", "Nhà số 90 phố Thợ Nhuộm, Hà Nội", "Tân Trào, Tuyên Quang", "Nhà số 48 phố Hàng Ngang, Hà Nội"],
        correct: 1
      },
      {
        q: "Tại ngôi nhà số 90 phố Thợ Nhuộm (Hà Nội), ai là người đã viết nên Luận cương chính trị tháng 10/1930?",
        options: ["Nguyễn Ái Quốc", "Lê Hồng Phong", "Trần Phú", "Trường Chinh"],
        correct: 2
      },
      {
        q: "Hiện nay, ngôi nhà số 90 phố Thợ Nhuộm (Hà Nội) đang được xếp hạng là loại di tích gì?",
        options: ["Di tích lịch sử cấp Tỉnh/Thành phố", "Di tích kiến trúc nghệ thuật cấp Quốc gia", "Danh lam thắng cảnh cấp Quốc gia", "Di tích lịch sử quốc gia"],
        correct: 3
      },
      {
        q: "Luận cương tháng 10/1930 nhấn mạnh nhiệm vụ gì?",
        options: ["Phản phong", "Phản đế", "Giải phóng dân tộc", "Khởi nghĩa vũ trang"],
        correct: 0
      },
      {
        q: "Khẩu hiệu chiến lược của Luận cương tháng 10/1930 trong việc giải quyết vấn đề ruộng đất là gì?",
        options: ["'Tăng gia sản xuất, giảm tức giảm phụ'", "'Người cày có ruộng'", "'Tấc đất tấc vàng, ruộng đất về tay nông dân'", "'Tịch thu ruộng đất của thực dân chia cho dân nghèo'"],
        correct: 1
      },
      {
        q: "Hạn chế lớn nhất của Luận cương chính trị tháng 10/1930 khi xác định nhiệm vụ cách mạng là gì?",
        options: ["Không đánh giá đúng khả năng cách mạng của giai cấp công nhân và nông dân", "Coi trọng vai trò của tư sản dân tộc và tiểu tư sản hơn giai cấp vô sản", "Chưa đặt nhiệm vụ giải phóng dân tộc lên hàng đầu mà quá nặng về đấu tranh giai cấp và cách mạng ruộng đất", "Chưa xác định được phương pháp đấu tranh vũ trang để giành chính quyền"],
        correct: 2
      },
      {
        q: "Trong Luận cương T10/1930, lực lượng cách mạng được tập hợp chủ yếu là ai?",
        options: ["Công nhân, nông dân và tư sản dân tộc", "Công nhân, nông dân và tiểu tư sản", "Tất cả các tầng lớp, giai cấp yêu nước", "Công nhân và nông dân"],
        correct: 3
      },
      {
        q: "Đỉnh cao của phong trào cách mạng 1930 - 1931 là gì? Điền vào chỗ trống câu nói của Bác Hồ: '.... bị thất bại, nhưng đã có ảnh hưởng lớn. Tinh thần anh dũng của nó luôn luôn nồng nặc trong tâm hồn quần chúng, và nó đã mở đường cho thắng lợi về sau'.",
        options: ["Xô viết Nghệ - Tĩnh (Xô viết Nghệ An - Hà Tĩnh)", "Khởi nghĩa Nam Kỳ", "Khởi nghĩa Bắc Sơn", "Bãi công Bến Thủy"],
        correct: 0
      },
      {
        q: "Chính quyền Xô viết Nghệ - Tĩnh nở rộ và đạt đỉnh cao tại thời điểm nào?",
        options: ["Tháng 02/1930", "Tháng 09/1930", "Tháng 05/1930", "Tháng 11/1930"],
        correct: 1
      },
      {
        q: "Chính quyền Xô viết Nghệ - Tĩnh là chính quyền của những giai cấp nào?",
        options: ["Chính quyền tư sản và tiểu tư sản, đại diện cho liên minh trí thức - thương nhân", "Chính quyền liên hiệp gồm công nhân, nông dân, địa chủ và tư sản dân tộc", "Chính quyền công - nông, là chính quyền cách mạng của quần chúng lao động do Đảng lãnh đạo", "Chính quyền quân quản do các lực lượng vũ trang nhân dân nắm giữ toàn bộ thẩm quyền"],
        correct: 2
      },
      {
        q: "Cuộc biểu tình của nông dân Hưng Nguyên bị đàn áp dữ dội, máy bay Pháp ném bom giết chết 171 người diễn ra vào ngày tháng năm nào?",
        options: ["Ngày 01/05/1930", "Ngày 20/10/1930", "Ngày 22/12/1930", "Ngày 12/09/1930"],
        correct: 3
      },
      {
        q: "Ngày 12/9 hằng năm hiện nay được chọn làm ngày kỷ niệm gì của tỉnh Nghệ An?",
        options: ["Ngày Xô viết Nghệ - Tĩnh", "Ngày thành lập Đảng bộ tỉnh Nghệ An", "Ngày hội Văn hóa làng Sen", "Ngày giải phóng tỉnh Nghệ An"],
        correct: 0
      },
      {
        q: "Ngày 12/09/1930, máy bay Pháp ném bom giết chết bao nhiêu người trong cuộc biểu tình của nông dân Hưng Nguyên?",
        options: ["717 người", "171", "117 người", "177 người"],
        correct: 1
      },
      {
        q: "Ngày 18/11/1930, tổ chức tập hợp lực lượng cách mạng được Đảng chủ trương thành lập là tổ chức gì?",
        options: ["Mặt trận Dân chủ Đông Dương", "Hội phản đế đồng minh", "Mặt trận Việt Minh", "Hội Liên hiệp Quốc dân Việt Nam"],
        correct: 1
      },
      {
        q: "Ngày 18/11 hằng năm hiện nay được Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam chọn làm ngày truyền thống gì?",
        options: ["Ngày thành lập Hội Liên hiệp Phụ nữ Việt Nam", "Ngày truyền thống Công nhân Việt Nam", "Ngày thành lập Mặt trận Dân tộc Thống nhất Việt Nam (Ngày hội Đại đoàn kết toàn dân tộc)", "Ngày thành lập Đoàn Thanh niên Cộng sản Hồ Chí Minh"],
        correct: 2
      },
      {
        q: "Hội phản đế đồng minh được thành lập vào thời gian nào?",
        options: ["Ngày 03/02/1930", "Ngày 26/03/1931", "Ngày 19/05/1941", "Ngày 18/11/1930"],
        correct: 3
      }
    ];

    let currentQuestionIndex = 0;

    // Khởi tạo Select Box chọn câu hỏi
    const qSelect = document.getElementById("qSelect");
    rawQuestions.forEach((item, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = `Câu ${index + 1}: ${item.q.substring(0, 50)}...`;
      qSelect.appendChild(opt);
    });

    // Hiển thị câu hỏi hiện tại
    function renderQuestion() {
      const q = rawQuestions[currentQuestionIndex];
      document.getElementById("qSelect").value = currentQuestionIndex;
      document.getElementById("currentQTitle").textContent = `Câu ${currentQuestionIndex + 1}/${rawQuestions.length}`;
      document.getElementById("currentQText").textContent = q.q;

      const labels = ["A", "B", "C", "D"];
      const container = document.getElementById("currentQOptions");
      container.innerHTML = "";

      q.options.forEach((optText, i) => {
        const div = document.createElement("div");
        const isCorrect = i === q.correct;
        div.className = `opt-item ${isCorrect ? 'opt-correct' : ''}`;
        div.textContent = `${labels[i]}. ${optText} ${isCorrect ? ' (✓ Đáp án đúng)' : ''}`;
        container.appendChild(div);
      });
    }

    // Nhảy tới câu hỏi chọn từ danh sách
    function jumpToQuestion(index) {
      currentQuestionIndex = parseInt(index);
      renderQuestion();
    }

    // Điều hướng câu tiếp theo / câu trước
    document.getElementById("nextQBtn").onclick = () => {
      if (currentQuestionIndex < rawQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        alert("Đã đến câu hỏi cuối cùng!");
      }
    };

    document.getElementById("prevQBtn").onclick = () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    };

    // Gửi câu hỏi lên Server
    document.getElementById("sendQBtn").onclick = () => {
      const currentQ = rawQuestions[currentQuestionIndex];
      s.emit("sendQuestion", currentQ);
      alert(`Đã phát câu ${currentQuestionIndex + 1} tới tất cả các máy!`);
    };

    // Tải câu đầu tiên khi mở trang
    renderQuestion();
  </script>
</body>
</html>
