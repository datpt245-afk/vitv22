<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><h1>🎤 DUCK RACE — MC</h1><div class="card"><button class="primary" onclick="start()">▶️ BẮT ĐẦU GAME</button> <button class="danger" onclick="resetGame()">🔄 RESET</button><p id="msg"></p></div><div class="card"><h2>📝 CÀI CÂU HỎI</h2><div id="qs"></div><button class="primary" onclick="add()">➕ THÊM CÂU</button> <button onclick="save()">💾 LƯU</button></div><div class="card"><h2>🏆 ĐIỂM NHÓM</h2><div id="teams" class="grid5"></div></div><div class="card"><h2>👤 ĐIỂM CÁ NHÂN</h2><div id="inds"></div></div><script src="/socket.io/socket.io.js"></script><script>const s=io();let qs=[];function add(){qs.push({q:"",options:["","","",""],answer:0,points:10});render()}function render(){qsEl=document.getElementById("qs");qsEl.innerHTML=qs.map((q,i)=>`<div class="card"><h3>Câu ${i+1}</h3><input class="qq" data-i="${i}" value="${q.q.replaceAll('"','&quot;')}" placeholder="Câu hỏi" style="width:100%;padding:12px"><div class="grid2">${q.options.map((o,j)=>`<input class="oo" data-i="${i}" data-j="${j}" value="${o.replaceAll('"','&quot;')}" placeholder="${"ABCD"[j]}" style="padding:12px">`).join("")}</div><p>Đáp án <select class="aa" data-i="${i}">${[0,1,2,3].map(j=>`<option value="${j}" ${q.answer===j?"selected":""}>${"ABCD"[j]}</option>`).join("")}</select> Điểm <input class="pp" data-i="${i}" type="number" value="${q.points}" min="1" style="width:80px"> <button class="danger" onclick="del(${i})">Xóa</button></p></div>`).join("")}function sync(){document.querySelectorAll(".qq").forEach(e=>qs[e.dataset.i].q=e.value);document.querySelectorAll(".oo").forEach(e=>qs[e.dataset.i].options[e.dataset.j]=e.value);document.querySelectorAll(".aa").forEach(e=>qs[e.dataset.i].answer=+e.value);document.querySelectorAll(".pp").forEach(e=>qs[e.dataset.i].points=+e.value||10)}function save(){sync();s.emit("mcSaveQuestions",qs)}function start(){sync();s.emit("mcSaveQuestions",qs);setTimeout(()=>s.emit("mcStart"),200)}function del(i){qs.splice(i,1);render()}function resetGame(){if(confirm("Reset game và xóa câu hỏi?"))s.emit("mcReset")}s.on("mcQuestionsSaved",d=>msg.textContent="Đã lưu "+d.count+" câu.");s.on("mcError",e=>msg.textContent="⚠️ "+e);s.on("state",x=>teams.innerHTML=x.teams.map(t=>`<div class="teamBox">${t.name}<br><b>${t.score}</b></div>`).join(""));s.on("gameFinished",d=>inds.innerHTML=d.individuals.map(p=>`<div class="card">${p.name} — Nhóm ${p.group} — <b>${p.score}</b> điểm</div>`).join(""));add()</script></div></body></html>
