<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bấm Chuông Duck Race</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .buzz-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff4757, #ff6b81);
      color: white;
      font-size: 28px;
      font-weight: bold;
      border: 8px solid #ffffff30;
      box-shadow: 0 10px 25px rgba(255,71,87,0.5);
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .buzz-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(255,71,87,0.3);
    }
    .buzz-btn:disabled {
      background: #718093;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔔 ĐĂNG KÝ & BẤM CHUÔNG</h1>

    <!-- KHU VỰC ĐĂNG KÝ -->
    <div id="joinForm" class="card">
      <h2>Nhập thông tin</h2>
      <input id="pName" type="text" placeholder="Họ và tên..." style="width:100%; padding:12px; margin-bottom:12px; font-size:16px;">
      <select id="pGroup" style="width:100%; padding:12px; margin-bottom:15px; font-size:16px;">
        <option value="1">Nhóm 1</option>
        <option value="2">Nhóm 2</option>
        <option value="3">Nhóm 3</option>
        <option value="4">Nhóm 4</option>
        <option value="5">Nhóm 5</option>
      </select>
      <button class="primary" style="width:100%; padding:14px; font-size:18px;" onclick="join()">VÀO GAME</button>
      <p id="err" style="color: #ff6b6b; margin-top:10px; font-weight:bold;"></p>
    </div>

    <!-- KHU VỰC CHUÔNG (VÀO NGAY SAU KHU ĐĂNG KÝ) -->
    <div id="buzzArea" class="card" style="display:none; text-align:center;">
      <h2 id="userInfo"></h2>
      <p id="statusMsg" style="font-weight:bold; color:#ffd43b; font-size:18px;">Chờ MC bắt đầu game...</p>
      
      <button id="buzzBtn" class="buzz-btn" onclick="buzz()" disabled>BẤM CHUÔNG</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();
    let me = JSON.parse(sessionStorage.getItem("me") || "null");

    if (me) {
      showBuzzArea();
    }

    function join() {
      let name = document.getElementById("pName").value.trim();
      let group = Number(document.getElementById("pGroup").value);
      if (!name) return document.getElementById("err").textContent = "Vui lòng nhập tên!";
      s.emit("joinPlayer", { name, group });
    }

    s.on("joined", d => {
      me = d;
      sessionStorage.setItem("me", JSON.stringify(me));
      showBuzzArea();
    });

    s.on("joinError", e => {
      document.getElementById("err").textContent = e;
    });

    function showBuzzArea() {
      document.getElementById("joinForm").style.display = "none";
      document.getElementById("buzzArea").style.display = "block";
      document.getElementById("userInfo").textContent = `👤 ${me.name} (Nhóm ${me.group})`;
    }

    function buzz() {
      s.emit("buzz");
    }

    s.on("answerAccess", d => {
      sessionStorage.setItem("answer", JSON.stringify(d));
      location = "/answer.html";
    });

    s.on("state", st => {
      if (!me) return;
      const btn = document.getElementById("buzzBtn");
      const msg = document.getElementById("statusMsg");

      let isLocked = st.lockedGroups && st.lockedGroups.includes(me.group);

      if (!st.started) {
        btn.disabled = true;
        msg.textContent = "⏳ Chờ MC bắt đầu game...";
      } else if (st.activeResponder) {
        btn.disabled = true;
        if (st.activeResponder.group === me.group) {
          msg.textContent = "🔔 Nhóm bạn đang giành quyền trả lời!";
        } else {
          msg.textContent = `📢 Nhóm ${st.activeResponder.group} (${st.activeResponder.name}) đang trả lời...`;
        }
      } else if (isLocked) {
        btn.disabled = true;
        msg.textContent = "❌ Nhóm bạn đã bị khóa lượt câu này!";
      } else {
        btn.disabled = false;
        msg.textContent = "⚡ SẴN SÀNG BẤM CHUÔNG!";
      }
    });

    s.on("gameReset", () => {
      sessionStorage.removeItem("me");
      location.reload();
    });
  </script>
</body>
</html>
