<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duck Race - Chuông</title><link rel="stylesheet" href="/style.css">
<style>body{display:grid;place-items:center}.box{width:min(94vw,520px);text-align:center}.team{font-size:24px;font-weight:900}.name{margin:18px 0}.buzz{display:block;margin:20px auto;width:230px;height:230px;border:0;border-radius:50%;background:#ed4d62;color:#fff;font-size:31px;font-weight:900;box-shadow:0 15px #a52d3d;cursor:pointer}.buzz:active{transform:translateY(10px);box-shadow:0 5px #a52d3d}.buzz:disabled{opacity:.3;cursor:not-allowed}.status{min-height:30px}</style></head>
<body><div class="card box"><h1>🔔 DUCK RACE</h1><div class="team" id="team"></div><div id="join">
<input id="name" class="name" placeholder="Nhập tên thành viên"><button class="btn primary" onclick="join()">Vào chuông</button>
</div><div id="play" style="display:none"><div class="muted" id="me"></div><button id="buzz" class="buzz" onclick="buzz()">🔔<br>BẤM CHUÔNG</button><div id="status" class="status">Đang chờ MC mở câu hỏi...</div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const p=new URLSearchParams(location.search),group=p.get("group")||"1",s=io();let name="";
team.textContent="NHÓM "+group;
function join(){name=document.getElementById("name").value.trim();if(!name)return alert("Nhập tên trước nhé!");s.emit("joinMember",{group,name})}
s.on("joined",x=>{document.getElementById("join").style.display="none";document.getElementById("play").style.display="block";document.getElementById("me").textContent="👤 "+x.name+" • Nhóm "+group});
function buzz(){document.getElementById("buzz").disabled=true;s.emit("buzz",{group,name})}
s.on("buzzed",x=>{document.getElementById("buzz").disabled=true;status.textContent="🚨 "+x.name+" (Nhóm "+x.group+") GIÀNH QUYỀN!"});
s.on("questionOpened",()=>{document.getElementById("buzz").disabled=false;status.textContent="🔔 Câu hỏi đã mở — bấm thật nhanh!"});
s.on("resetBuzz",()=>{document.getElementById("buzz").disabled=false;status.textContent="🔔 Các nhóm được cướp quyền!"});
s.on("result",x=>{status.textContent=x.group==group&&x.name==name?"🎉 Đúng! Điểm cá nhân đã được cộng.":"✅ Câu đã chốt."});
s.on("wrong",x=>{status.textContent=x.group==group&&x.name==name?"❌ Sai — chờ quyền cướp tiếp theo.":"🔔 Đang chờ nhóm khác..."});
</script></body></html>
