<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duck Race</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div id="join" class="card"><h1>🦆 DUCK RACE</h1><input id="name" placeholder="Tên thành viên" style="width:100%;padding:14px;margin:7px 0"><select id="group" style="width:100%;padding:14px;margin:7px 0"><option value="1">Nhóm 1</option><option value="2">Nhóm 2</option><option value="3">Nhóm 3</option><option value="4">Nhóm 4</option><option value="5">Nhóm 5</option></select><button class="primary" onclick="join()">Vào game</button></div><div id="lobby" class="card hidden"><h1 id="who"></h1><p id="status">Chờ MC...</p><button id="buzz" class="danger" style="width:100%;font-size:30px;padding:35px" onclick="buzz()">🔔 BẤM CHUÔNG</button></div><div id="wait" class="card hidden"><h1>🏆 Bạn giành quyền!</h1><p>Đang mở màn hình trả lời...</p></div><script src="/socket.io/socket.io.js"></script><script>const s=io();let me=null;function join(){let n=name.value.trim(),g=+group.value;if(n)s.emit("joinPlayer",{name:n,group:g})}s.on("joined",d=>{me=d;joinEl=join;joinEl.classList.add("hidden");lobby.classList.remove("hidden");who.textContent=d.name+" — Nhóm "+d.group});s.on("state",x=>{if(!me)return;buzz.disabled=!x.started||!!x.activeResponder||x.lockedGroups.includes(me.group)||x.finished;status.textContent=!x.started?"Chờ MC bắt đầu...":x.lockedGroups.includes(me.group)?"Nhóm bạn đã bị khóa ở câu này.":x.activeResponder?"Đang có người trả lời...":"🔔 Chuông đang mở!"});function buzz(){s.emit("buzz")}s.on("buzzWinner",d=>{if(me&&d.name===me.name&&d.group===me.group){lobby.classList.add("hidden");wait.classList.remove("hidden")}});s.on("answerAccess",d=>{sessionStorage.setItem("answer",JSON.stringify(d));location="/answer.html"})</script></div></body></html>
