<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duck Race - Màn Hình Trình Chiếu</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
    }
    .screen-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .status-banner {
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 15px 25px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .winner-title {
      font-size: 32px;
      font-weight: 900;
      color: #f1f5f9;
      margin: 0;
    }
    .status-sub {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 5px;
    }
    .q-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #334155;
    }
    .q-text {
      font-size: 28px;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 20px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .opt-item {
      background: #334155;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      color: #cbd5e1;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .opt-item.reveal-correct {
      background: #15803d;
      color: #fff;
      border-color: #4ade80;
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
    }
    .race-track {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 20px;
    }
    .score-card {
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-card h4 { margin: 0; font-size: 16px; color: #94a3b8; }
    .score-card .pts { font-size: 24px; font-weight: 900; color: #38bdf8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="screen-container">
    
    <!-- Banner Trạng Thái -->
    <div class="status-banner">
      <div id="screenWinner" class="winner-title">🦆 SẴN SÀNG ĐUA VỊT!</div>
      <div id="screenStatus" class="status-sub">Đang chờ MC bắt đầu trò chơi...</div>
    </div>

    <!-- Khung Câu Hỏi & Đáp Án -->
    <div class="q-card">
      <div id="screenQText" class="q-text">Chưa mở câu hỏi nào</div>
      <div id="screenOpts" class="options-grid"></div>
    </div>

    <!-- Đường Đua Vịt -->
    <div class="race-track">
      <h2 style="margin-top:0; color:#38bdf8;">🏁 ĐƯỜNG ĐUA TRỰC TIẾP</h2>
      <div id="screenRace"></div>
      
      <!-- Bảng điểm nhanh 5 Nhóm bên dưới đường đua -->
      <div id="screenScores" class="scoreboard"></div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const qs = id => document.getElementById(id);
    let currentGameState = null;

    socket.on("state", state => {
      currentGameState = state;
      renderRace(state);
      renderScores(state);

      if (state.currentQuestion >= 0 && state.questions[state.currentQuestion]) {
        showQuestion(state.questions[state.currentQuestion], state.answerRevealed);
      } else {
        qs("screenQText").textContent = "Chưa mở câu hỏi";
        qs("screenOpts").innerHTML = "";
      }
    });

    function showQuestion(q, reveal = false) {
      qs("screenQText").textContent = `Câu ${currentGameState.currentQuestion + 1}: ${q.q}`;
      const labels = ["A", "B", "C", "D"];
      qs("screenOpts").innerHTML = q.options.map((opt, i) => {
        const isCorrect = reveal && i === q.answer;
        return `<div class="opt-item ${isCorrect ? 'reveal-correct' : ''}">
          ${labels[i]}. ${opt} ${isCorrect ? '✓ (ĐÚNG)' : ''}
        </div>`;
      }).join("");
    }

    function renderRace(x) {
      const names = ["🟥", "🟦", "🟩", "🟨", "🟪"];
      const colors = ["red", "blue", "green", "yellow", "purple"];
      
      // Tính % vịt bơi dựa trên điểm cao nhất hoặc mốc chuẩn (mỗi 10 điểm = 100%)
      qs("screenRace").innerHTML = Object.values(x.teams).map((t, i) => {
        const pct = Math.min(100, Math.max(0, (Number(t.score) || 0) * 10)); 
        return `
          <div class="lane">
            <div class="n">${names[i]} ${t.name}</div>
            <div class="line"></div>
            <div class="swimDuck ${colors[i]}" style="left: calc(${pct}% - 30px)">
              <span class="body">🦆</span>
              <span class="wave">〰️〰️</span>
              <span class="splash">💦</span>
            </div>
            <div class="finish">🏁</div>
          </div>
        `;
      }).join("");
    }

    function renderScores(x) {
      qs("screenScores").innerHTML = Object.values(x.teams).map(t => `
        <div class="score-card">
          <h4>${t.name}</h4>
          <div class="pts">${t.score} đ</div>
        </div>
      `).join("");
    }

    // Lắng nghe sự kiện từ Server
    socket.on("questionOpened", x => {
      qs("screenWinner").textContent = `❓ CÂU HỎI SỐ ${x.index + 1}`;
      qs("screenStatus").textContent = "Các nhóm nhanh tay bấm chuông giành quyền trả lời!";
      showQuestion(x.question, false);
    });

    socket.on("buzzed", x => {
      qs("screenWinner").textContent = `🚨 ${x.name.toUpperCase()} (NHÓM ${x.group}) BẤM CHUÔNG!`;
      qs("screenStatus").textContent = "Đang có 10 giây để đưa ra đáp án...";
    });

    socket.on("result", x => {
      qs("screenWinner").textContent = `🎉 ${x.name} (NHÓM ${x.group}) TRẢ LỜI ĐÚNG!`;
      qs("screenStatus").textContent = `+${x.teamStep} điểm nhóm | +${x.personalPoint} điểm cá nhân`;
      if (currentGameState && currentGameState.questions[currentGameState.currentQuestion]) {
        showQuestion(currentGameState.questions[currentGameState.currentQuestion], true);
      }
    });

    socket.on("wrong", x => {
      if (x.timedOut) {
        qs("screenWinner").textContent = `⏱️ ${x.name} (NHÓM ${x.group}) HẾT 10 GIÂY!`;
      } else {
        qs("screenWinner").textContent = `❌ ${x.name} (NHÓM ${x.group}) TRẢ LỜI SAI!`;
      }
      qs("screenStatus").textContent = `Nhóm ${x.group} bị khóa ở câu này. Mở lại chuông cho các nhóm còn lại!`;
    });

    socket.on("questionSkipped", () => {
      qs("screenWinner").textContent = "⚠️ CẢ 5 NHÓM ĐỀU KHÔNG TRẢ LỜI ĐÚNG!";
      qs("screenStatus").textContent = "Hệ thống tự động bỏ qua và chuẩn bị chuyển sang câu tiếp theo...";
    });

    socket.on("resetBuzz", () => {
      qs("screenWinner").textContent = "🔔 CHUÔNG ĐÃ MỞ LẠI!";
      qs("screenStatus").textContent = "Mời các nhóm còn lại cướp quyền trả lời!";
    });

    socket.on("gameFinished", () => {
      qs("screenWinner").textContent = "🏆 TRÒ CHƠI KẾT THÚC!";
      qs("screenStatus").textContent = "Xin chúc mừng nhóm chiến thắng!";
    });
  </script>
</body>
</html>
