<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duck Race - Màn Hình Trình Chiếu 2D</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
    }
    .screen-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .status-banner {
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 15px 25px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .winner-title {
      font-size: 32px;
      font-weight: 900;
      color: #f1f5f9;
      margin: 0;
    }
    .status-sub {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 5px;
    }
    .q-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #334155;
    }
    .q-text {
      font-size: 28px;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 20px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .opt-item {
      background: #334155;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      color: #cbd5e1;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .opt-item.reveal-correct {
      background: #15803d;
      color: #fff;
      border-color: #4ade80;
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
    }
    
    /* ĐƯỜNG ĐUA BƠI BỂ NƯỚC 2D */
    .race-track {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .lane-container {
      position: relative;
      background: linear-gradient(90deg, #1e3a8a 0%, #0284c7 50%, #0369a1 100%);
      border-radius: 12px;
      margin-bottom: 16px;
      height: 85px;
      display: flex;
      align-items: center;
      border: 1px solid rgba(56, 189, 248, 0.3);
      overflow: hidden;
    }
    .lane-info {
      position: absolute;
      left: 12px;
      top: 8px;
      z-index: 5;
      background: rgba(15, 23, 42, 0.75);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #f8fafc;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .finish-line {
      position: absolute;
      right: 25px;
      top: 0;
      bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(
        0deg,
        #fff, #fff 10px,
        #000 10px, #000 20px
      );
      z-index: 2;
      opacity: 0.85;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* CON VỊT 2D VÀ HIỆU ỨNG BƠI MƯỢT MÀ */
    .duck-wrapper {
      position: absolute;
      bottom: 6px;
      left: 0%;
      z-index: 4;
      /* Quán tính lướt bơi siêu mượt */
      transition: left 1.2s cubic-bezier(0.34, 1.3, 0.64, 1);
      display: flex;
      align-items: center;
    }
    
    /* Nhấp nhô nhịp nhàng trên mặt nước */
    .duck-body-2d {
      animation: swimFloat 2s ease-in-out infinite;
      transform-origin: bottom center;
      filter: drop-shadow(0 6px 4px rgba(0,0,0,0.4));
    }

    @keyframes swimFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-3deg); }
    }

    /* Sóng nước sau đuôi vịt */
    .water-ripple {
      position: absolute;
      left: -20px;
      bottom: 8px;
      width: 30px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: rippleAnim 1s infinite linear;
      z-index: -1;
    }

    @keyframes rippleAnim {
      0% { transform: scale(0.6) translateX(0); opacity: 0.8; }
      100% { transform: scale(1.4) translateX(-15px); opacity: 0; }
    }

    /* BẢNG ĐIỂM */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .score-card {
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-card h4 { margin: 0; font-size: 15px; color: #94a3b8; }
    .score-card .pts { font-size: 26px; font-weight: 900; color: #38bdf8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="screen-container">
    
    <!-- Banner Trạng Thái -->
    <div class="status-banner">
      <div id="screenWinner" class="winner-title">🦆 ĐƯỜNG ĐUA VỊT 2D SẴN SÀNG!</div>
      <div id="screenStatus" class="status-sub">Đang chờ MC bắt đầu trò chơi...</div>
    </div>

    <!-- Khung Câu Hỏi & Đáp Án -->
    <div class="q-card">
      <div id="screenQText" class="q-text">Chưa mở câu hỏi nào</div>
      <div id="screenOpts" class="options-grid"></div>
    </div>

    <!-- Đường Đua Vịt 2D -->
    <div class="race-track">
      <h2 style="margin-top:0; color:#38bdf8; display:flex; align-items:center; gap:8px;">
        🌊 BỂ BƠI THI ĐẤU TRỰC TIẾP
      </h2>
      <div id="screenRace"></div>
      
      <!-- Bảng điểm nhanh 5 Nhóm -->
      <div id="screenScores" class="scoreboard"></div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const qs = id => document.getElementById(id);
    let currentGameState = null;

    // Màu sắc đại diện cho 5 đội vịt 2D
    const teamColors = [
      { body: "#EF4444", wing: "#B91C1C", name: "Nhóm 1 (Đỏ)" },
      { body: "#3B82F6", wing: "#1D4ED8", name: "Nhóm 2 (Xanh)" },
      { body: "#22C55E", wing: "#15803D", name: "Nhóm 3 (Lá)" },
      { body: "#FACC15", wing: "#CA8A04", name: "Nhóm 4 (Vàng)" },
      { body: "#A855F7", wing: "#7E22CE", name: "Nhóm 5 (Tím)" }
    ];

    socket.on("state", state => {
      currentGameState = state;
      renderRace(state);
      renderScores(state);

      if (state.currentQuestion >= 0 && state.questions[state.currentQuestion]) {
        showQuestion(state.questions[state.currentQuestion], state.answerRevealed);
      } else {
        qs("screenQText").textContent = "Chưa mở câu hỏi";
        qs("screenOpts").innerHTML = "";
      }
    });

    function showQuestion(q, reveal = false) {
      qs("screenQText").textContent = `Câu ${currentGameState.currentQuestion + 1}: ${q.q}`;
      const labels = ["A", "B", "C", "D"];
      qs("screenOpts").innerHTML = q.options.map((opt, i) => {
        const isCorrect = reveal && i === q.answer;
        return `<div class="opt-item ${isCorrect ? 'reveal-correct' : ''}">
          ${labels[i]}. ${opt} ${isCorrect ? '✓ (ĐÚNG)' : ''}
        </div>`;
      }).join("");
    }

    // Mẫu SVG Vịt 2D vector hướng sang phải
    function getDuckSVG(mainColor, wingColor) {
      return `
        <svg width="65" height="52" viewBox="0 0 100 80" class="duck-body-2d">
          <!-- Đuôi vịt -->
          <path d="M 10 38 Q 0 28 16 30" stroke="${wingColor}" stroke-width="7" stroke-linecap="round" fill="none"/>
          <!-- Thân vịt -->
          <path d="M 15 40 C 15 62, 45 68, 72 58 C 84 52, 86 38, 76 33 C 65 28, 50 33, 42 26 C 30 26, 18 32, 15 40 Z" fill="${mainColor}"/>
          <!-- Cánh vịt -->
          <path d="M 26 42 C 26 56, 50 56, 52 42 C 42 36, 32 36, 26 42 Z" fill="${wingColor}"/>
          <!-- Đầu vịt -->
          <circle cx="64" cy="24" r="18" fill="${mainColor}"/>
          <!-- Mỏ vịt màu cam -->
          <path d="M 78 20 C 92 21, 95 27, 80 32 Z" fill="#F97316"/>
          <!-- Mắt vịt -->
          <circle cx="70" cy="20" r="3.5" fill="#0F172A"/>
          <circle cx="71.5" cy="18.5" r="1.3" fill="#FFFFFF"/>
          <!-- Má hồng -->
          <circle cx="64" cy="28" r="4" fill="#F43F5E" opacity="0.4"/>
        </svg>
      `;
    }

    function renderRace(x) {
      const teams = Object.values(x.teams);
      // Tìm điểm số cao nhất hiện tại của các nhóm
      const maxScore = Math.max(...teams.map(t => Number(t.score) || 0), 1);

      qs("screenRace").innerHTML = teams.map((t, i) => {
        const score = Number(t.score) || 0;
        
        // Tỉ lệ quãng đường: Con vịt dẫn đầu sẽ nằm ở mốc 85% bể bơi, các vịt khác bơi theo tỉ lệ tương ứng
        // Giúp con vịt bơi xa nhất luôn rõ ràng mà không sợ vượt khỏi khung hình
        const pct = score === 0 ? 2 : Math.min(85, Math.max(2, (score / Math.max(maxScore, 10)) * 85));
        const c = teamColors[i] || teamColors[0];

        return `
          <div class="lane-container">
            <div class="lane-info">${t.name} — ${score} điểm</div>
            
            <div class="duck-wrapper" style="left: ${pct}%;">
              <div class="water-ripple"></div>
              ${getDuckSVG(c.body, c.wing)}
            </div>

            <div class="finish-line"></div>
          </div>
        `;
      }).join("");
    }

    function renderScores(x) {
      qs("screenScores").innerHTML = Object.values(x.teams).map(t => `
        <div class="score-card">
          <h4>${t.name}</h4>
          <div class="pts">${t.score} đ</div>
        </div>
      `).join("");
    }

    // Lắng nghe sự kiện trực tiếp từ Server
    socket.on("questionOpened", x => {
      qs("screenWinner").textContent = `❓ CÂU HỎI SỐ ${x.index + 1}`;
      qs("screenStatus").textContent = "Các nhóm nhanh tay bấm chuông giành quyền trả lời!";
      showQuestion(x.question, false);
    });

    socket.on("buzzed", x => {
      qs("screenWinner").textContent = `🚨 ${x.name.toUpperCase()} (NHÓM ${x.group}) BẤM CHUÔNG!`;
      qs("screenStatus").textContent = "Đang có 10 giây để chọn đáp án...";
    });

    socket.on("result", x => {
      qs("screenWinner").textContent = `🎉 ${x.name} (NHÓM ${x.group}) TRẢ LỜI ĐÚNG!`;
      qs("screenStatus").textContent = `+${x.teamStep} điểm nhóm | +${x.personalPoint} điểm cá nhân`;
      if (currentGameState && currentGameState.questions[currentGameState.currentQuestion]) {
        showQuestion(currentGameState.questions[currentGameState.currentQuestion], true);
      }
    });

    socket.on("wrong", x => {
      if (x.timedOut) {
        qs("screenWinner").textContent = `⏱️ ${x.name} (NHÓM ${x.group}) HẾT 10 GIÂY!`;
      } else {
        qs("screenWinner").textContent = `❌ ${x.name} (NHÓM ${x.group}) TRẢ LỜI SAI!`;
      }
      qs("screenStatus").textContent = `Nhóm ${x.group} bị khóa ở câu này. Mở lại chuông cho các nhóm còn lại!`;
    });

    socket.on("questionSkipped", () => {
      qs("screenWinner").textContent = "⚠️ CẢ 5 NHÓM ĐỀU KHÔNG TRẢ LỜI ĐÚNG!";
      qs("screenStatus").textContent = "Hệ thống tự động bỏ qua và chuẩn bị chuyển sang câu tiếp theo...";
    });

    socket.on("resetBuzz", () => {
      qs("screenWinner").textContent = "🔔 CHUÔNG ĐÃ MỞ LẠI!";
      qs("screenStatus").textContent = "Mời các nhóm còn lại cướp quyền trả lời!";
    });

    socket.on("gameFinished", () => {
      qs("screenWinner").textContent = "🏆 TRÒ CHƠI KẾT THÚC!";
      qs("screenStatus").textContent = "Xin chúc mừng nhóm bơi xa nhất!";
    });
  </script>
</body>
</html>
