<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Màn Chiếu Duck Race</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .question-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .option-card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 16px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      text-align: left;
      transition: all 0.4s ease;
    }
    /* ĐÁP ÁN ĐÚNG SẼ SÁNG LÊN VỚI HIỆU ỨNG NÀY */
    .option-card.correct-highlight {
      background: #2ed573 !important;
      color: #ffffff !important;
      border-color: #7bed9f !important;
      box-shadow: 0 0 25px #2ed573;
      transform: scale(1.03);
    }
    .status-banner {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
      min-height: 32px;
      color: #ffd43b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style="text-align: center;">🏁 MÀN CHIẾU GAME DUCK RACE</h1>

    <!-- BẢNG CÂU HỎI & ĐÁP ÁN HIỂN THỊ TRÊN MÀN CHIẾU -->
    <div class="card">
      <div class="question-box">
        <h2 id="qTitle" style="color: #48dbfb; margin-bottom: 10px;">Đang chờ trò chơi bắt đầu...</h2>
        <h1 id="qText" style="font-size: 28px; margin: 10px 0;"></h1>
        <div id="optionsGrid" class="options-grid" style="display: none;">
          <div id="opt0" class="option-card">A. </div>
          <div id="opt1" class="option-card">B. </div>
          <div id="opt2" class="option-card">C. </div>
          <div id="opt3" class="option-card">D. </div>
        </div>
      </div>
      <div id="statusBanner" class="status-banner"></div>
    </div>

    <!-- ĐƯỜNG ĐUA / ĐIỂM SỐ CÁC NHÓM -->
    <div class="card">
      <h2>🏆 ĐƯỜNG ĐUA CÁC NHÓM</h2>
      <div id="teams" class="grid5"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const s = io();
    let currentQ = null;

    s.on("questionStarted", d => {
      currentQ = d.question;
      document.getElementById("qTitle").textContent = `CÂU HỎI SỐ ${d.number}`;
      document.getElementById("qText").textContent = d.question.q;
      
      const grid = document.getElementById("optionsGrid");
      grid.style.display = "grid";

      // Reset màu sắc đáp án
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`opt${i}`);
        el.className = "option-card";
        el.textContent = `${"ABCD"[i]}. ${d.question.options[i] || ""}`;
      }
      
      document.getElementById("statusBanner").textContent = "⚡ Hãy bấm chuông nhanh tay!";
    });

    s.on("buzzWinner", d => {
      document.getElementById("statusBanner").textContent = `🔔 Nhóm ${d.group} (${d.name}) đã giành quyền trả lời!`;
    });

    s.on("answerResult", r => {
      if (r.correct) {
        document.getElementById("statusBanner").textContent = `🎉 CHÍNH XÁC! Nhóm ${r.group} (${r.name}) cộng +${r.points} điểm.`;
        
        // SÁNG ĐÁP ÁN ĐÚNG LÊN TRÊN MÀN CHIẾU
        if (currentQ && currentQ.answer !== undefined) {
          const correctOpt = document.getElementById(`opt${currentQ.answer}`);
          if (correctOpt) {
            correctOpt.classList.add("correct-highlight");
          }
        }
      } else {
        document.getElementById("statusBanner").textContent = `❌ TRẢ LỜI SAI! Nhóm ${r.group} bị khóa lượt câu này.`;
      }
    });

    s.on("buzzReopened", () => {
      setTimeout(() => {
        document.getElementById("statusBanner").textContent = "⚡ Chuông đã mở lại cho các nhóm còn lại!";
      }, 1200);
    });

    s.on("questionSkipped", d => {
      document.getElementById("statusBanner").textContent = `⚠️ Tất cả các nhóm đã trả lời sai! Chuyển sang câu tiếp theo...`;
    });

    s.on("state", x => {
      // Cập nhật điểm các nhóm
      document.getElementById("teams").innerHTML = x.teams.map(t => `
        <div class="teamBox" style="padding: 15px; border-radius: 8px; text-align: center; background: rgba(255,255,255,0.05);">
          <div style="font-size: 18px;">${t.name}</div>
          <b style="font-size: 32px; color: #f1c40f;">${t.score}</b> điểm
        </div>
      `).join("");

      if (!x.started && !x.finished) {
        document.getElementById("qTitle").textContent = "Đang chờ trò chơi bắt đầu...";
        document.getElementById("qText").textContent = "";
        document.getElementById("optionsGrid").style.display = "none";
        document.getElementById("statusBanner").textContent = "";
      }
    });

    s.on("gameFinished", d => {
      document.getElementById("qTitle").textContent = "🏁 GAME KẾT THÚC";
      document.getElementById("qText").textContent = "CHÚC MỪNG CÁC ĐỘI XUẤT SẮC!";
      document.getElementById("optionsGrid").style.display = "none";
      document.getElementById("statusBanner").textContent = "";
    });

    s.on("gameReset", () => {
      location.reload();
    });
  </script>
</body>
</html>
