<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duck Race Screen</title><link rel="stylesheet" href="/style.css"><style>body{overflow:hidden;background:linear-gradient(#63def6,#067eaf)}.screen{max-width:1500px;margin:auto;padding:20px}.title{text-align:center;font-size:44px;font-weight:1000}.race{background:linear-gradient(#32cbe8,#0577ab);border-radius:28px;padding:12px 25px;box-shadow:inset 0 0 50px #004b6b66}.lane{height:82px;border-bottom:2px dashed #fff5;position:relative}.name{position:absolute;left:0;top:25px;background:#063b57dd;padding:7px 12px;border-radius:999px;font-weight:900}.duck{position:absolute;top:20px;left:80px;width:80px;height:45px;transition:left 1s cubic-bezier(.2,.8,.2,1);animation:bob .5s infinite alternate}.body{position:absolute;left:15px;top:10px;width:52px;height:32px;border-radius:60%;background:#ffd43b;box-shadow:0 5px 7px #0004}.head{position:absolute;left:48px;top:0;width:30px;height:30px;border-radius:50%;background:#ffd43b}.eye{position:absolute;left:18px;top:7px;width:6px;height:6px;border-radius:50%;background:#111}.beak{position:absolute;left:26px;top:14px;width:17px;height:9px;border-radius:70%;background:#ff8c22}.wing{position:absolute;left:18px;top:18px;width:24px;height:14px;border-radius:70%;background:#0002;animation:wing .25s infinite alternate}.splash{position:absolute;left:0;top:37px;width:70px;border-bottom:4px solid #fff9;border-radius:50%}.d1 .body,.d1 .head{background:#ff5252}.d2 .body,.d2 .head{background:#4d9fff}.d3 .body,.d3 .head{background:#35d07f}.d4 .body,.d4 .head{background:#ffd43b}.d5 .body,.d5 .head{background:#b76cff}@keyframes bob{to{transform:translateY(-5px) rotate(3deg)}}@keyframes wing{to{transform:rotate(-25deg)}}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:15px}.score{background:#063b57dd;border-radius:16px;padding:14px;text-align:center;font-weight:900}.score b{font-size:28px}@media(max-width:900px){.title{font-size:30px}.scores{grid-template-columns:1fr 1fr}}</style></head><body><div class="screen"><div class="title">🦆 DUCK RACE</div><div id="race" class="race"></div><div id="scores" class="scores"></div></div><script src="/socket.io/socket.io.js"></script><script>const s=io();function draw(x){let ts=x.teams||[],max=Math.max(1,...ts.map(t=>t.score));race.innerHTML=ts.map((t,i)=>`<div class="lane"><div class="name">${t.name}</div><div class="duck d${i+1}" style="left:calc(${t.score/max*76}% + 80px)"><div class="splash"></div><div class="body"><div class="wing"></div></div><div class="head"><div class="eye"></div><div class="beak"></div></div></div></div>`).join("");scores.innerHTML=ts.map(t=>`<div class="score">${t.name}<br><b>${t.score}</b> điểm</div>`).join("")}s.on("state",draw)</script></body></html>
