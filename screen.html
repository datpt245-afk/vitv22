<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn Chiếu Quần Vợt / Quiz Game</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; padding: 20px; text-align: center; }
    h1 { margin-bottom: 20px; color: #38bdf8; font-size: 2.5rem; }
    .status-box { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; font-size: 1.5rem; border: 2px solid #334155; }
    .winner { color: #f59e0b; font-weight: bold; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
    
    .question-box { background: #1e293b; border-radius: 16px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; }
    .q-title { font-size: 2rem; margin-bottom: 20px; color: #f8fafc; font-weight: bold; line-height: 1.4; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .opt-btn { background: #334155; padding: 20px; border-radius: 12px; font-size: 1.3rem; color: #e2e8f0; font-weight: 600; border: 3px solid transparent; }
    .opt-btn.correct { background: #15803d; border-color: #22c55e; color: #fff; }
    
    .scoreboard { display: flex; justify-content: space-around; gap: 10px; margin-top: 20px; }
    .team-card { background: #1e293b; border-radius: 12px; padding: 15px; flex: 1; border: 2px solid #334155; }
    .team-card.locked { opacity: 0.5; filter: grayscale(1); }
    .team-name { font-size: 1.2rem; font-weight: bold; color: #94a3b8; }
    .team-score { font-size: 2.5rem; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

  <h1>SÂN THI ĐẤU GIẢI ĐỐ</h1>

  <div class="status-box">
    <div id="screenWinner" class="winner">ĐANG CHỜ MỞ CÂU HỎI...</div>
    <div id="screenStatus" style="font-size: 1.2rem; margin-top: 5px; color: #94a3b8;"></div>
  </div>

  <div class="question-box">
    <div id="qTitle" class="q-title">Chờ MC bật câu hỏi...</div>
    <div class="options-grid">
      <div id="opt0" class="opt-btn">A. ---</div>
      <div id="opt1" class="opt-btn">B. ---</div>
      <div id="opt2" class="opt-btn">C. ---</div>
      <div id="opt3" class="opt-btn">D. ---</div>
    </div>
  </div>

  <div id="scoreboard" class="scoreboard"></div>

  <script>
    const socket = io();
    const qs = id => document.getElementById(id);
    let buzzTimer = null;

    function renderScoreboard(teams, lockedGroups) {
      const sb = qs("scoreboard");
      sb.innerHTML = "";
      Object.keys(teams).forEach(g => {
        const t = teams[g];
        const isLocked = lockedGroups.includes(g);
        const card = document.createElement("div");
        card.className = `team-card ${isLocked ? 'locked' : ''}`;
        card.innerHTML = `
          <div class="team-name">${t.name}</div>
          <div class="team-score">${t.score}</div>
          <div style="font-size: 0.9rem; color: #64748b;">Đúng: ${t.correct}</div>
        `;
        sb.appendChild(card);
      });
    }

    socket.on("state", state => {
      renderScoreboard(state.teams, state.lockedGroups);
      
      if (state.currentQuestion >= 0 && state.questions[state.currentQuestion]) {
        const q = state.questions[state.currentQuestion];
        qs("qTitle").textContent = `Câu ${state.currentQuestion + 1}: ${q.q}`;
        q.options.forEach((opt, idx) => {
          const btn = qs(`opt${idx}`);
          btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;
          
          if (state.answerRevealed && idx === q.answer) {
            btn.classList.add("correct");
          } else {
            btn.classList.remove("correct");
          }
        });
      } else {
        qs("qTitle").textContent = "Chờ MC bật câu hỏi...";
        [0,1,2,3].forEach(i => {
          qs(`opt${i}`).textContent = `${String.fromCharCode(65 + i)}. ---`;
          qs(`opt${i}`).classList.remove("correct");
        });
      }

      if (!state.activeResponder && state.questionOpen) {
        qs("screenWinner").textContent = "🔔 SẴN SÀNG BẤM CHUÔNG!";
        qs("screenStatus").textContent = "Các đội nhanh tay cướp quyền trả lời!";
      }
    });

    // 🔴 XỬ LÝ CHUÔNG VỚI ĐẾM NGƯỢC CHÍNH XÁC 5 GIÂY
    socket.on("buzzed", x => {
      if (buzzTimer) clearInterval(buzzTimer);
      
      qs("screenWinner").textContent = `🚨 ${x.name.toUpperCase()} (${x.group.toUpperCase()}) BẤM CHUÔNG!`;
      
      let timeLeft = 5; // <-- ĐÃ SỬA THÀNH 5 GIÂY
      qs("screenStatus").textContent = `⏱️ Còn ${timeLeft} giây để đưa ra đáp án...`;

      buzzTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          qs("screenStatus").textContent = `⏱️ Còn ${timeLeft} giây để đưa ra đáp án...`;
        } else {
          qs("screenStatus").textContent = "❌ ĐÃ HẾT 5 GIÂY SUY NGHĨ!";
          clearInterval(buzzTimer);
        }
      }, 1000);
    });

    socket.on("result", data => {
      if (buzzTimer) clearInterval(buzzTimer);
      if (data.correct) {
        qs("screenWinner").textContent = `🎉 ${data.name.toUpperCase()} TRẢ LỜI ĐÚNG! (+${data.teamStep} điểm)`;
        qs("screenStatus").textContent = "Tự động chuyển câu sau 5 giây...";
      }
    });

    socket.on("wrong", data => {
      if (buzzTimer) clearInterval(buzzTimer);
      qs("screenWinner").textContent = `❌ ${data.name.toUpperCase()} TRẢ LỜI SAI HOẶC QUÁ 5 GIÂY!`;
      qs("screenStatus").textContent = "Mời các nhóm còn lại tiếp tục bấm chuông!";
    });

    socket.on("questionSkipped", () => {
      if (buzzTimer) clearInterval(buzzTimer);
      qs("screenWinner").textContent = "⚠️ TẤT CẢ CÁC NHÓM ĐỀU TRẢ LỜI SAI!";
      qs("screenStatus").textContent = "Tự động chuyển câu sau 5 giây...";
    });

    socket.on("gameFinished", () => {
      if (buzzTimer) clearInterval(buzzTimer);
      qs("screenWinner").textContent = "🏆 TRÒ CHƠI KẾT THÚC!";
      qs("screenStatus").textContent = "Cảm ơn các đội đã tham gia!";
    });
  </script>
</body>
</html>
